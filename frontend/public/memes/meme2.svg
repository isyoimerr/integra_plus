<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-labelledby="title2">
  <title id="title2">Sigma meme motivacional</title>
  <rect width="420" height="260" rx="24" fill="#263238" />
  <circle cx="80" cy="80" r="52" fill="#ffb300" opacity="0.15" />
  <circle cx="340" cy="70" r="42" fill="#d84315" opacity="0.18" />
  <text x="210" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#fff" font-weight="800">¿Trancas con integrales?</text>
  <text x="210" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#cfd8dc">No te preocupes,</text>
  <text x="210" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="30" fill="#ffcc80" font-weight="700">Sigma te apoya.</text>
  <text x="210" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#eceff1">La fórmula menos divertida es la más poderosa.</text>
</svg>
