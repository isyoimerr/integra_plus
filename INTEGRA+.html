<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTEGRA+ — Cálculo Integral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #D0D5DD;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }
    @keyframes levelPulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(46,125,50,0.13), 0 0 24px rgba(46,125,50,0.4); }
      50%       { box-shadow: 0 0 0 14px rgba(46,125,50,0.07), 0 0 36px rgba(46,125,50,0.55); }
    }
    @keyframes popIn {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      60%  { transform: scale(1.15) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-10px) rotate(0deg);   opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(640px) rotate(600deg); opacity: 0; }
    }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 0; height: 0; }
    button, input { font-family: 'Inter', sans-serif; }
    .tweaks-panel {
      position: fixed; bottom: 20px; right: 20px;
      background: #ffffff; border-radius: 16px;
      padding: 18px 18px 20px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.18);
      z-index: 99999; width: 220px;
      border: 1px solid #E4E4E4; display: none;
      font-family: 'Inter', sans-serif;
    }
    .tweaks-panel.open { display: block; animation: fadeSlideUp 0.22s ease both; }
    .tweaks-title { font-size: 12px; font-weight: 700; color: #1A1A1A; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .tweaks-section { font-size: 10px; font-weight: 700; color: #AAAAAA; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 7px; margin-top: 12px; }
    .tweaks-btn { padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #E4E4E4; background: #fff; color: #444; margin-bottom: 4px; width: 100%; text-align: left; transition: all 0.15s; }
    .tweaks-btn:hover { background: #F5F5F5; }
    .tweaks-btn.active { background: #F0FBF1; border-color: #2E7D32; color: #2E7D32; font-weight: 600; }
    .tweaks-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .tweaks-chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1.5px solid #E4E4E4; background: #fff; color: #666; transition: all 0.15s; }
    .tweaks-chip.active { background: #F0FBF1; border-color: #2E7D32; color: #2E7D32; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── INTEGRA+ Shared Components ──────────────────────────────────────────────

const ThemeCtx = React.createContext(null);

const THEMES = {
  light: {
    appBg: '#F5F5F5',
    cardBg: '#ffffff',
    cardBorder: '#E8E8E8',
    headerBg: 'linear-gradient(150deg, #1B5E20 0%, #2E7D32 100%)',
    headerText: '#ffffff',
    primary: '#2E7D32',
    primaryDark: '#1B5E20',
    primaryLight: '#43A047',
    text: '#1A1A1A',
    text2: '#555555',
    text3: '#999999',
    progressBg: '#EEEEEE',
    streakBg: '#FFF8E1',
    streakColor: '#F57F17',
    navBg: '#ffffff',
    navBorder: '#E8E8E8',
    inputBorder: '#E0E0E0',
  },
  dark: {
    appBg: '#0F1117',
    cardBg: '#1A1D27',
    cardBorder: 'rgba(255,255,255,0.09)',
    headerBg: 'linear-gradient(150deg, #07090F 0%, #13162A 100%)',
    headerText: '#E8EAF0',
    primary: '#00B4D8',
    primaryDark: '#007EA0',
    primaryLight: '#48CAE4',
    text: '#E8EAF0',
    text2: '#9EA3B5',
    text3: '#5A6080',
    progressBg: 'rgba(255,255,255,0.08)',
    streakBg: 'rgba(255,179,0,0.15)',
    streakColor: '#FFB300',
    navBg: '#13162A',
    navBorder: 'rgba(255,255,255,0.08)',
    inputBorder: 'rgba(255,255,255,0.12)',
  },
  custom: {
    appBg: '#F5F5F5',
    cardBg: '#ffffff',
    cardBorder: '#E8E8E8',
    headerBg: 'linear-gradient(150deg, #4527A0 0%, #7E57C2 100%)',
    headerText: '#ffffff',
    primary: '#7E57C2',
    primaryDark: '#4527A0',
    primaryLight: '#9575CD',
    text: '#1A1A1A',
    text2: '#555555',
    text3: '#999999',
    progressBg: '#EEEEEE',
    streakBg: '#FFF8E1',
    streakColor: '#F57F17',
    navBg: '#ffffff',
    navBorder: '#E8E8E8',
    inputBorder: '#E0E0E0',
  },
};

const SIGMA_STATES = {
  neutral: {
    bg: '#7E57C2',
    eyes: [{cx:56,cy:36,r:4.5},{cx:70,cy:36,r:4.5}],
    mouthD: 'M54 60 Q63 69 72 60',
    brows: null, eyeLines: null,
  },
  celebracion: {
    bg: '#2E7D32',
    eyes: [{cx:56,cy:33,r:6},{cx:70,cy:33,r:6}],
    mouthD: 'M50 56 Q63 75 76 56',
    brows: null, eyeLines: null,
  },
  apoyo: {
    bg: '#F57F17',
    eyes: [{cx:56,cy:38,r:4.5},{cx:70,cy:38,r:4.5}],
    mouthD: 'M55 66 Q63 59 71 66',
    brows: ['M51 28 Q55 24 59 28','M67 24 Q71 28 75 28'],
    eyeLines: null,
  },
  alerta: {
    bg: '#E53935',
    eyes: [{cx:56,cy:38,r:4.5},{cx:70,cy:38,r:4.5}],
    mouthD: 'M55 65 L71 65',
    brows: ['M51 29 Q55 25 59 28','M67 25 Q71 29 75 28'],
    eyeLines: null,
  },
  inactivo: {
    bg: '#546E7A',
    eyes: null,
    mouthD: 'M55 62 L71 62',
    brows: null,
    eyeLines: ['M52 36 L60 36','M66 36 L74 36'],
  },
};

function SigmaLogo({ state = 'neutral', size = 40 }) {
  const s = SIGMA_STATES[state] || SIGMA_STATES.neutral;
  return (
    <svg width={size} height={size} viewBox="0 0 100 100"
      xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0,transition:'all 0.4s ease'}}>
      <rect width="100" height="100" rx="22" fill={s.bg}/>
      <line x1="22" y1="18" x2="78" y2="18" stroke="white" strokeWidth="7" strokeLinecap="round"/>
      <line x1="22" y1="82" x2="78" y2="82" stroke="white" strokeWidth="7" strokeLinecap="round"/>
      <line x1="25" y1="21" x2="50" y2="50" stroke="white" strokeWidth="7" strokeLinecap="round"/>
      <line x1="50" y1="50" x2="25" y2="79" stroke="white" strokeWidth="7" strokeLinecap="round"/>
      {s.brows && s.brows.map((d,i) =>
        <path key={i} d={d} fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round"/>
      )}
      {s.eyes
        ? s.eyes.map((e,i) => <circle key={i} cx={e.cx} cy={e.cy} r={e.r} fill="white"/>)
        : s.eyeLines && s.eyeLines.map((d,i) =>
            <path key={i} d={d} stroke="white" strokeWidth="4" strokeLinecap="round" fill="none"/>
          )
      }
      <path d={s.mouthD} fill="none" stroke="white" strokeWidth="4" strokeLinecap="round"/>
    </svg>
  );
}

function SigmaBubble({ state = 'neutral', children }) {
  const th = React.useContext(ThemeCtx) || THEMES.light;
  const palettes = {
    neutral:    { border:'#7E57C2', bg:'rgba(126,87,194,0.10)', nameColor:'#7E57C2' },
    celebracion:{ border:'#2E7D32', bg:'rgba(46,125,50,0.10)',  nameColor:'#2E7D32' },
    apoyo:      { border:'#F57F17', bg:'rgba(245,127,23,0.10)', nameColor:'#E65100' },
    alerta:     { border:'#E53935', bg:'rgba(229,57,53,0.10)',  nameColor:'#C62828' },
    inactivo:   { border:'#546E7A', bg:'rgba(84,110,122,0.10)', nameColor:'#546E7A' },
  };
  const c = palettes[state] || palettes.neutral;
  return (
    <div style={{display:'flex',gap:10,alignItems:'flex-start',padding:'12px 14px',borderRadius:13,marginBottom:16,borderLeft:`3px solid ${c.border}`,background:c.bg,transition:'all 0.3s'}}>
      <SigmaLogo state={state} size={36}/>
      <div style={{flex:1}}>
        <div style={{fontSize:9,fontWeight:700,color:c.nameColor,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.6px',fontFamily:"'DM Sans',sans-serif"}}>SIGMA</div>
        <div style={{fontSize:13,color:th.text2,lineHeight:1.65,fontStyle:'italic'}}>{children}</div>
      </div>
    </div>
  );
}

function XPBadge({ points }) {
  return (
    <span style={{background:'#FFF8E1',color:'#F57F17',fontWeight:700,fontSize:14,borderRadius:20,padding:'6px 16px',border:'1.5px solid #FFE082',display:'inline-flex',alignItems:'center',gap:5}}>
      +{points} XP ⚡
    </span>
  );
}

function ProgressBar({ value, color = '#2E7D32', height = 8, bgColor = '#EEEEEE' }) {
  return (
    <div style={{background:bgColor,borderRadius:height,height,overflow:'hidden'}}>
      <div style={{width:`${Math.max(0,Math.min(100,value))}%`,height,borderRadius:height,background:color,transition:'width 0.7s cubic-bezier(0.4,0,0.2,1)'}}/>
    </div>
  );
}

function LevelNode({ status, number, title, stars = 0, onClick }) {
  const th = React.useContext(ThemeCtx) || THEMES.light;
  const isDone   = status === 'done';
  const isActive = status === 'active';
  const isLocked = status === 'locked';
  return (
    <div onClick={!isLocked ? onClick : undefined}
      style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,
        cursor: !isLocked ? 'pointer' : 'default',userSelect:'none'}}>
      <div style={{
        width:68,height:68,borderRadius:'50%',
        background: isDone ? '#2E7D32' : isActive ? th.cardBg : th.progressBg,
        border:`3px solid ${isDone ? '#2E7D32' : isActive ? '#2E7D32' : th.cardBorder}`,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize: isDone ? 24 : isActive ? 20 : 20,
        fontWeight: 700,
        color: isDone ? '#fff' : isActive ? '#2E7D32' : th.text3,
        boxShadow: isActive
          ? '0 0 0 8px rgba(46,125,50,0.13), 0 0 24px rgba(46,125,50,0.4)'
          : isDone ? '0 4px 14px rgba(46,125,50,0.28)' : 'none',
        animation: isActive ? 'levelPulse 2.2s ease-in-out infinite' : 'none',
        transition: 'all 0.25s ease',
      }}>
        {isDone ? '✓' : isActive ? number : '🔒'}
      </div>
      <div style={{textAlign:'center',maxWidth:110}}>
        <div style={{fontSize:13,fontWeight:600,color:isLocked ? th.text3 : th.text,lineHeight:1.3}}>{title}</div>
        {isDone   && <div style={{fontSize:14,marginTop:3}}>{'⭐'.repeat(stars)}{'☆'.repeat(3-stars)}</div>}
        {isActive && <div style={{fontSize:11,color:'#2E7D32',fontWeight:700,marginTop:3}}>En curso →</div>}
        {isLocked && <div style={{fontSize:11,color:th.text3,marginTop:2}}>Bloqueado</div>}
      </div>
    </div>
  );
}

function BottomNav({ screen, setScreen, t }) {
  const theme = t || THEMES.light;
  const items = [
    { id:'dashboard', label:'Inicio',   icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" width="21" height="21"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> },
    { id:'levels',    label:'Niveles',  icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" width="21" height="21"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg> },
    { id:'exercise',  label:'Práctica', icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" width="21" height="21"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> },
    { id:'profile',   label:'Perfil',   icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" width="21" height="21"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> },
  ];
  return (
    <div style={{display:'flex',borderTop:`1px solid ${theme.navBorder}`,background:theme.navBg,flexShrink:0,paddingBottom:'env(safe-area-inset-bottom,0px)'}}>
      {items.map(item => {
        const active = screen === item.id;
        return (
          <button key={item.id} onClick={() => setScreen(item.id)}
            style={{flex:1,padding:'10px 0 8px',border:'none',background:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,color:active ? theme.primary : '#AAAAAA',transition:'color 0.18s'}}>
            {item.icon}
            <span style={{fontSize:10,fontWeight:active?700:500}}>{item.label}</span>
          </button>
        );
      })}
    </div>
  );
}

Object.assign(window, { ThemeCtx, SigmaLogo, SigmaBubble, XPBadge, ProgressBar, LevelNode, BottomNav, THEMES, SIGMA_STATES });
// ── INTEGRA+ Onboarding Wizard ───────────────────────────────────────────────

function Confetti() {
  const pieces = React.useMemo(() => Array.from({length:55}, (_,i) => ({
    id: i,
    x: Math.random() * 100,
    color: ['#2E7D32','#7E57C2','#F57F17','#1565C0','#43A047','#FFB300','#E91E63','#00B4D8'][i%8],
    delay: Math.random() * 1.5,
    duration: 2.2 + Math.random() * 1.8,
    size: 7 + Math.random() * 9,
    radius: i % 3 === 0 ? '50%' : i % 3 === 1 ? '3px' : '1px',
    rotate: Math.random() * 360,
  })), []);
  return (
    <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,overflow:'hidden',pointerEvents:'none',zIndex:5}}>
      {pieces.map(p => (
        <div key={p.id} style={{
          position:'absolute', left:`${p.x}%`, top:0,
          width:p.size, height:p.size * (0.5 + Math.random() * 0.8),
          background:p.color, borderRadius:p.radius,
          animationName:'confettiFall',
          animationDuration:`${p.duration}s`,
          animationDelay:`${p.delay}s`,
          animationTimingFunction:'cubic-bezier(0.25,0.46,0.45,0.94)',
          animationFillMode:'both',
          transform:`rotate(${p.rotate}deg)`,
        }}/>
      ))}
    </div>
  );
}

function OnboardingWizard({ onComplete }) {
  const [step, setStep] = React.useState(0);
  const [nickname, setNickname] = React.useState('');
  const [levelChoice, setLevelChoice] = React.useState(null);
  const [styleChoice, setStyleChoice] = React.useState(null);
  const [themeChoice, setThemeChoice] = React.useState('light');
  const [showFinal, setShowFinal] = React.useState(false);
  const [animKey, setAnimKey] = React.useState(0);

  const TOTAL = 4;

  const levels = [
    { id:'zero', emoji:'🟢', title:'Empiezo desde cero', desc:'Inicie el curso ' },
    { id:'mid',  emoji:'🟡', title:'Lo he visto un poco', desc:'Pero se me va bastante' },
    { id:'basic',emoji:'🔵', title:'Ya sé lo básico', desc:'Quiero reforzar' },
  ];
  const styles = [
    { id:'intense', emoji:'🔥', title:'Intenso y motivador', desc:'Dame caña' },
    { id:'chill',   emoji:'😄', title:'Relajado y casual',   desc:'Sin presión' },
    { id:'serious', emoji:'📚', title:'Serio y directo',     desc:'Solo lo importante' },
  ];
  const themes = [
    { id:'light',  emoji:'☀️', title:'Claro',          desc:'Crecimiento',   previewBg:'linear-gradient(135deg,#2E7D32,#43A047)' },
    { id:'dark',   emoji:'🌙', title:'Oscuro',         desc:'Profundidad',   previewBg:'linear-gradient(135deg,#1A1A2E,#0F1117)' },
    { id:'custom', emoji:'🎨', title:'Personalizable', desc:'Tu color',      previewBg:'linear-gradient(135deg,#7E57C2,#9575CD)' },
  ];

  const sigmaByStep = ['neutral','neutral','neutral','celebracion'];
  const sigmaMsg = [
    'Antes de empezar, ¿cómo quieres que te llame?',
    '¿En qué punto estás con el cálculo integral?',
    '¿Cómo prefieres que te acompañe?',
    '¡Ya casi! ¿Cómo quieres ver la app?',
  ];

  const canContinue = () => {
    if (step === 0) return nickname.trim().length > 0;
    if (step === 1) return levelChoice !== null;
    if (step === 2) return styleChoice !== null;
    return true;
  };

  const handleNext = () => {
    if (step === 3) { setShowFinal(true); return; }
    setAnimKey(k => k+1);
    setStep(s => s+1);
  };

  if (showFinal) {
    return (
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        padding:'40px 28px',background:'#fff',position:'relative',overflow:'hidden',textAlign:'center'}}>
        <Confetti/>
        <div style={{position:'relative',zIndex:6,display:'flex',flexDirection:'column',alignItems:'center',gap:18}}>
          <div style={{animation:'popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both'}}>
            <SigmaLogo state="celebracion" size={86}/>
          </div>
          <div>
            <div style={{fontSize:34,fontWeight:800,color:'#1A1A1A',letterSpacing:'-1px',lineHeight:1.15,animation:'fadeSlideUp 0.5s 0.3s both'}}>
              ¡Listo, {nickname || 'amigo'}!
            </div>
            <div style={{fontSize:15,color:'#7E57C2',fontStyle:'italic',fontWeight:500,marginTop:8,lineHeight:1.6,animation:'fadeSlideUp 0.5s 0.45s both'}}>
              "Ya sé cómo acompañarte.<br/>Vamos a aprender cálculo juntos."
            </div>
          </div>
          <div style={{fontSize:13,color:'#888',lineHeight:1.6,animation:'fadeSlideUp 0.5s 0.6s both'}}>
            Tu ruta personalizada está lista.
          </div>
          <button onClick={() => onComplete({ nickname, theme: themeChoice, level: levelChoice, style: styleChoice })}
            style={{marginTop:8,background:'#2E7D32',color:'#fff',border:'none',borderRadius:16,
              padding:'17px 36px',fontSize:18,fontWeight:700,cursor:'pointer',width:'100%',maxWidth:300,
              boxShadow:'0 10px 32px rgba(46,125,50,0.38)',
              animation:'fadeSlideUp 0.5s 0.75s both',
              letterSpacing:'-0.3px'}}>
            Empezar mi ruta 🚀
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#fff',overflow:'hidden'}}>
      {/* Progress header */}
      <div style={{padding:'24px 24px 0',flexShrink:0}}>
        <div style={{display:'flex',gap:6,marginBottom:20}}>
          {Array.from({length:TOTAL}).map((_,i) => (
            <div key={i} style={{flex:1,height:4,borderRadius:4,
              background: i <= step ? '#2E7D32' : '#EEEEEE',
              transition:'background 0.35s ease'}}/>
          ))}
        </div>
        <div style={{fontSize:11,color:'#BBBBBB',fontWeight:600,letterSpacing:'0.4px',textTransform:'uppercase'}}>
          Paso {step+1} de {TOTAL}
        </div>
      </div>

      {/* Content */}
      <div key={animKey} style={{flex:1,padding:'12px 24px 0',overflowY:'auto',animation:'fadeSlideUp 0.28s ease both'}}>
        <div style={{marginTop:12}}>
          <SigmaBubble state={sigmaByStep[step]}>{sigmaMsg[step]}</SigmaBubble>
        </div>

        {/* Step 0 — name */}
        {step === 0 && (
          <div>
            <div style={{fontSize:22,fontWeight:700,color:'#1A1A1A',marginBottom:18}}>¿Cómo te llamo?</div>
            <input autoFocus value={nickname}
              onChange={e => setNickname(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && canContinue() && handleNext()}
              placeholder="Mi apodo o nombre..."
              style={{width:'100%',fontSize:20,padding:'16px 18px',borderRadius:14,
                border:'2px solid #E0E0E0',outline:'none',fontFamily:'inherit',transition:'border-color 0.2s',
                color:'#1A1A1A',background:'#fff'}}
              onFocus={e => e.target.style.borderColor='#2E7D32'}
              onBlur={e => e.target.style.borderColor='#E0E0E0'}
            />
            <div style={{fontSize:12,color:'#BBBBBB',marginTop:10,textAlign:'center'}}>
              Puedes cambiarlo después en tu perfil
            </div>
          </div>
        )}

        {/* Step 1 — level */}
        {step === 1 && (
          <div>
            <div style={{fontSize:22,fontWeight:700,color:'#1A1A1A',marginBottom:16}}>Tu nivel actual</div>

        { icon:'▦', title:'Área bajo la curva', formula:'A = ∫ₐᵇ f(x) dx', desc:'Si f(x) ≥ 0 en [a,b], la integral definida es exactamente el área de la región bajo la curva.' },
        { icon:'±', title:'Signo del área', formula:'∫ₐᵇ = −∫ᵦₐ', desc:'Intercambiar límites cambia el signo. Áreas bajo el eje x son negativas.' },
      ],
    },
    exercises: [
      { n:1, total:8, q:'Aplica el Teorema Fundamental del Cálculo', formula:'∫₀² x dx = ?',
        opts:['1', '2', '4'], correct:'B',
        hint:'Antiderivada de x es x²/2. Evalúa en 2 y en 0, resta.',
        explain:'F(x)=x²/2 → F(2)−F(0) = 4/2 − 0 = 2' },
      { n:2, total:8, q:'Aplica el Teorema Fundamental del Cálculo', formula:'∫₁³ 2x dx = ?',
        opts:['6', '8', '4'], correct:'B',
        hint:'Antiderivada de 2x es x². Evalúa: F(3)−F(1) = 9−1 = 8.',
        explain:'F(x)=x² → F(3)−F(1) = 9−1 = 8' },
      { n:3, total:8, q:'Integra y evalúa en los límites', formula:'∫₀¹ (x² + 1) dx = ?',
        opts:['4/3', '2/3', '1'], correct:'A',
        hint:'Antiderivada: x³/3 + x. Evalúa en 1: 1/3 + 1 = 4/3. En 0: 0.',
        explain:'F(x)=x³/3+x → F(1)−F(0) = (1/3+1)−0 = 4/3' },
      { n:4, total:8, q:'Calcula la integral definida', formula:'∫₀^π sin(x) dx = ?',
        opts:['0', '1', '2'], correct:'C',
        hint:'Antiderivada de sin(x) es −cos(x). Evalúa: −cos(π)+cos(0).',
        explain:'F(x)=−cos(x) → −cos(π)−(−cos(0)) = 1+1 = 2' },
    ],
  },
};

// ── FASE B — Exercise ─────────────────────────────────────────────────────────
function LevelFaseBScreen({ levelId, exerciseIdx, setExerciseIdx, setScreen, setLastWrong, lives, setLives }) {
  const lv = LEVEL_CONFIG[levelId] || LEVEL_CONFIG[0];
  const ex = lv.exercises[exerciseIdx] || lv.exercises[0];
  const [selected, setSelected] = React.useState(null);
  const [verifying, setVerifying] = React.useState(false);
  const [shaking, setShaking] = React.useState(false);
  const curLives = (lives !== undefined && lives !== null) ? lives : 3;

  const verify = () => {
    if (!selected) return;
    setVerifying(true);
    setTimeout(() => {
      if (selected === ex.correct) {
        setScreen('result_correct');
      } else {
        const newLives = Math.max(0, curLives - 1);
        if (setLives) setLives(newLives);
        setShaking(true);
        setTimeout(() => setShaking(false), 600);
        setLastWrong({ hint: ex.hint, explain: ex.explain, selectedId: selected });
        setScreen('result_wrong');
      }
      setVerifying(false);
    }, 600);
  };

  const optIds = ['A','B','C'];

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#F5F5F5',overflow:'hidden'}}>
      {/* Header */}
      <div style={{background:lv.headerBg,padding:'16px 20px 20px',flexShrink:0,
        boxShadow:'0 4px 20px rgba(0,0,0,0.15)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <button onClick={()=>setScreen('level_fase_a')}
            style={{background:'rgba(255,255,255,0.16)',border:'none',borderRadius:10,
              width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',
              cursor:'pointer',color:'#fff',fontSize:18,flexShrink:0}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.7)',letterSpacing:'0.4px'}}>{lv.title} · FASE B</div>
            <div style={{fontSize:14,fontWeight:600,color:'#fff'}}>
              Ejercicio {ex.n} de {ex.total}
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {/* Lives */}
            <div style={{display:'flex',gap:2}}>
              {[1,2,3].map(i => (
                <span key={i} style={{fontSize:14,
                  filter: i > curLives ? 'grayscale(1) opacity(0.35)' : 'none',
                  transition:'all 0.3s'}}>❤️</span>
              ))}
            </div>
            <div style={{background:'rgba(255,255,255,0.15)',borderRadius:20,
              padding:'4px 10px',fontSize:12,color:'#fff',fontWeight:600}}>
              {lv.xpPerExercise} XP
            </div>
          </div>
        </div>
        {/* Progress segments */}
        <div style={{display:'flex',gap:4}}>
          {lv.exercises.map((_,i)=>(
            <div key={i} style={{flex:1,height:4,borderRadius:4,
              background: i < exerciseIdx ? '#fff'
                : i === exerciseIdx ? 'rgba(255,255,255,0.6)'
                : 'rgba(255,255,255,0.2)',
              transition:'background 0.3s'}}/>
          ))}
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
        <SigmaBubble state="neutral">
          {exerciseIdx === 0
            ? '¡Arrancamos! Lee bien el enunciado antes de responder. 🎯'
            : exerciseIdx === lv.exercises.length - 1
            ? '¡Último ejercicio! Lo tienes. Dale con todo. 💪'
            : 'Vas bien. Piensa antes de marcar. ¿Listo/a? 🧠'}
        </SigmaBubble>

        {/* Question */}
        <div style={{background:'#fff',borderRadius:14,padding:'16px 18px',
          border:'1px solid #E8E8E8',marginBottom:13,boxShadow:'0 2px 14px rgba(0,0,0,0.05)'}}>
          <div style={{fontSize:10,fontWeight:700,color:lv.color,textTransform:'uppercase',
            letterSpacing:'0.7px',marginBottom:8}}>Pregunta {ex.n}</div>
          <div style={{fontSize:14,color:'#555',lineHeight:1.6,marginBottom:12}}>{ex.q}</div>
          {/* Formula */}
          <div style={{background:`${lv.color}12`,borderRadius:10,padding:'12px 14px',
            textAlign:'center',border:`1px solid ${lv.color}25`}}>
            <div style={{fontSize:22,fontWeight:600,fontFamily:'Georgia,serif',color:lv.colorDark,
              letterSpacing:'0.5px'}}>{ex.formula}</div>
          </div>
        </div>

        {/* Options */}
        <div style={{fontSize:12,fontWeight:600,color:'#888',marginBottom:10,
          textTransform:'uppercase',letterSpacing:'0.5px'}}>Elige tu respuesta</div>
        <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:16}}>
          {ex.opts.map((opt,i)=>{
            const id = optIds[i];
            const sel = selected === id;
            return (
              <button key={id} onClick={()=>setSelected(id)}
                style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',
                  borderRadius:13,border:`2px solid ${sel?lv.color:'#EEEEEE'}`,
                  background:sel?`${lv.color}12`:'#fff',
                  cursor:'pointer',textAlign:'left',transition:'all 0.18s',outline:'none'}}>
                <div style={{width:30,height:30,borderRadius:9,flexShrink:0,transition:'all 0.18s',
                  background:sel?lv.color:'#F0F0F0',
                  color:sel?'#fff':'#777',
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontWeight:700,fontSize:13}}>
                  {id}

                <span style={{fontSize:18,fontWeight:600,fontFamily:'Georgia,serif',
                  color:sel?lv.colorDark:'#1A1A1A'}}>{opt}</span>
                {sel && <div style={{marginLeft:'auto',color:lv.color,fontSize:18}}>◉</div>}
              </button>
            );
          })}
        </div>

        <button onClick={verify} disabled={!selected}
          style={{width:'100%',padding:'16px',borderRadius:13,border:'none',
            background:selected?lv.headerBg:'#EEEEEE',
            color:selected?'#fff':'#AAAAAA',fontSize:16,fontWeight:700,
            cursor:selected?'pointer':'not-allowed',letterSpacing:'-0.2px',
            boxShadow:selected?`0 8px 24px ${lv.color}44`:'none',
            transition:'all 0.22s'}}>
          {verifying ? 'Verificando…' : 'Verificar respuesta'}
        </button>
      </div>
    </div>
  );
}

// ── EXERCISE EDITOR ───────────────────────────────────────────────────────────
function ExerciseEditorScreen({ setScreen, editingExercise }) {
  const ex = editingExercise || {};
  const [levelId, setLevelId] = React.useState(ex.levelId ?? 0);
  const [q,       setQ]       = React.useState(ex.q || '');
  const [formula, setFormula] = React.useState(ex.formula || '');
  const [opts,    setOpts]    = React.useState(ex.opts || ['','','']);
  const [correct, setCorrect] = React.useState(ex.correct || 'A');
  const [hint,    setHint]    = React.useState(ex.hint || '');
  const [explain, setExplain] = React.useState(ex.explain || '');
  const [xp,      setXp]      = React.useState(ex.xp || 15);
  const [saved,   setSaved]   = React.useState(false);
  const [errors,  setErrors]  = React.useState({});
  const isNew = ex.isNew !== false ? true : !ex.q;

  const levelColors = { 0:'#2E7D32', 1:'#1565C0', 2:'#7E57C2' };
  const color = levelColors[levelId] || '#2E7D32';
  const optIds = ['A','B','C'];

  const validate = () => {
    const e = {};
    if (!q.trim())      e.q       = 'El enunciado es requerido';
    if (!formula.trim())e.formula = 'La fórmula es requerida';
    if (!hint.trim())   e.hint    = 'La pista es requerida';
    if (!explain.trim())e.explain = 'La explicación es requerida';
    opts.forEach((o,i) => { if(!o.trim()) e[`opt${i}`] = 'Requerido'; });
    return e;
  };

  const handleSave = () => {
    const e = validate();
    if (Object.keys(e).length > 0) { setErrors(e); return; }
    setSaved(true);
    // TODO: POST /api/exercises (isNew) or PUT /api/exercises/:id
    setTimeout(() => setScreen('admin'), 900);
  };

  const fieldStyle = (err) => ({
    width:'100%', padding:'11px 13px', borderRadius:11, fontFamily:'Inter,sans-serif',
    fontSize:13, outline:'none', background:'#fff', color:'#1A1A1A',
    border: `1.5px solid ${err ? '#E53935' : '#E0E0E0'}`,
    transition:'border-color 0.2s', resize:'vertical',
  });

  const label = (txt, required) => (
    <div style={{fontSize:11,fontWeight:700,color:'#555',marginBottom:5,
      textTransform:'uppercase',letterSpacing:'0.4px'}}>
      {txt} {required && <span style={{color:'#E53935'}}>*</span>}
    </div>
  );

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#F5F5F5',overflow:'hidden'}}>
      {/* Header */}
      <div style={{background:`linear-gradient(150deg,${color}CC 0%,${color} 100%)`,
        padding:'18px 20px 20px',flexShrink:0,boxShadow:'0 4px 20px rgba(0,0,0,0.15)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setScreen('admin')}
            style={{background:'rgba(255,255,255,0.16)',border:'none',borderRadius:10,
              width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',
              cursor:'pointer',color:'#fff',fontSize:18,flexShrink:0}}>←</button>
          <div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.65)',fontWeight:600,
              textTransform:'uppercase',letterSpacing:'0.5px'}}>Admin Panel</div>
            <div style={{fontSize:17,fontWeight:700,color:'#fff'}}>
              {isNew ? 'Nuevo ejercicio' : 'Editar ejercicio'}
            </div>
          </div>
          {saved && (
            <div style={{marginLeft:'auto',background:'rgba(255,255,255,0.2)',
              borderRadius:20,padding:'4px 12px',fontSize:12,color:'#fff',fontWeight:600}}>
              ✓ Guardado
            </div>
          )}
        </div>
      </div>

      {/* Form */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>

        {/* Nivel selector */}
        <div style={{background:'#fff',borderRadius:13,padding:'14px 16px',
          marginBottom:12,border:'1px solid #E8E8E8',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          {label('Nivel', true)}
          <select value={levelId} onChange={e=>setLevelId(Number(e.target.value))}
            style={{...fieldStyle(false), appearance:'none',cursor:'pointer'}}>
            <option value={0}>Nivel 0 — Repaso de Bases</option>
            <option value={1}>Nivel 1 — Integral Indefinida</option>
            <option value={2}>Nivel 2 — Integral Definida</option>
          </select>
        </div>

        {/* Enunciado + Fórmula */}
        <div style={{background:'#fff',borderRadius:13,padding:'14px 16px',
          marginBottom:12,border:'1px solid #E8E8E8',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          <div style={{marginBottom:13}}>
            {label('Enunciado de la pregunta', true)}
            <textarea rows={3} value={q} onChange={e=>setQ(e.target.value)}
              placeholder="Ej: ¿Cuánto es 2/3 + 1/4?"
              style={fieldStyle(errors.q)}
              onFocus={e=>e.target.style.borderColor=color}
              onBlur={e=>e.target.style.borderColor=errors.q?'#E53935':'#E0E0E0'}/>
            {errors.q && <div style={{fontSize:11,color:'#E53935',marginTop:3}}>{errors.q}</div>}
          </div>
          {label('Fórmula', true)}
          <input value={formula} onChange={e=>setFormula(e.target.value)}
            placeholder="Ej: 2/3 + 1/4 = ?"
            style={{...fieldStyle(errors.formula), fontFamily:'Georgia,serif', fontSize:15}}
            onFocus={e=>e.target.style.borderColor=color}
            onBlur={e=>e.target.style.borderColor=errors.formula?'#E53935':'#E0E0E0'}/>
          {/* Preview */}
          {formula && (
            <div style={{marginTop:8,background:`${color}10`,borderRadius:9,padding:'10px',
              textAlign:'center',border:`1px solid ${color}20`}}>
              <span style={{fontSize:18,fontFamily:'Georgia,serif',color,fontWeight:600}}>
                {formula}
              </span>
            </div>
          )}
          {errors.formula && <div style={{fontSize:11,color:'#E53935',marginTop:3}}>{errors.formula}</div>}
        </div>

        {/* Opciones */}
        <div style={{background:'#fff',borderRadius:13,padding:'14px 16px',
          marginBottom:12,border:'1px solid #E8E8E8',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          {label('Opciones de respuesta', true)}
          <div style={{fontSize:11,color:'#AAA',marginBottom:10}}>
            Marca el radio ● junto a la opción correcta
          </div>
          {optIds.map((id,i)=>(
            <div key={id} style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <button onClick={()=>setCorrect(id)}
                  style={{width:26,height:26,borderRadius:'50%',flexShrink:0,
                    border:`2px solid ${correct===id ? color : '#DDD'}`,
                    background: correct===id ? color : '#fff',
                    cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
                    transition:'all 0.18s',outline:'none'}}>
                  {correct===id && <div style={{width:10,height:10,borderRadius:'50%',background:'#fff'}}/>}
                </button>
                <div style={{width:24,height:24,borderRadius:7,flexShrink:0,
                  background:`${color}18`,color,display:'flex',alignItems:'center',
                  justifyContent:'center',fontWeight:700,fontSize:12}}>
                  {id}
                </div>
                <input value={opts[i]} onChange={e=>{
                    const n=[...opts]; n[i]=e.target.value; setOpts(n);
                  }}
                  placeholder={`Opción ${id}`}
                  style={{...fieldStyle(errors[`opt${i}`]),flex:1,fontFamily:'Georgia,serif',fontSize:15}}
                  onFocus={e=>e.target.style.borderColor=color}
                  onBlur={e=>e.target.style.borderColor=errors[`opt${i}`]?'#E53935':'#E0E0E0'}/>
              </div>
              {correct===id && (
                <div style={{fontSize:11,color,fontWeight:600,marginTop:3,marginLeft:68}}>
                  ✓ Marcada como correcta
                </div>
              )}
              {errors[`opt${i}`] && (
                <div style={{fontSize:11,color:'#E53935',marginTop:3,marginLeft:68}}>
                  {errors[`opt${i}`]}
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Pista + Explicación */}
        <div style={{background:'#fff',borderRadius:13,padding:'14px 16px',
          marginBottom:12,border:'1px solid #E8E8E8',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          <div style={{marginBottom:13}}>
            {label('Pista pedagógica (SIGMA)', true)}
            <textarea rows={2} value={hint} onChange={e=>setHint(e.target.value)}
              placeholder="Ej: ¿Cuál es el MCM de 3 y 4?"
              style={fieldStyle(errors.hint)}
              onFocus={e=>e.target.style.borderColor=color}
              onBlur={e=>e.target.style.borderColor=errors.hint?'#E53935':'#E0E0E0'}/>
            {errors.hint && <div style={{fontSize:11,color:'#E53935',marginTop:3}}>{errors.hint}</div>}
          </div>
          {label('Explicación completa', true)}
          <textarea rows={3} value={explain} onChange={e=>setExplain(e.target.value)}
            placeholder="Ej: MCM(3,4)=12 → 8/12 + 3/12 = 11/12"
            style={fieldStyle(errors.explain)}
            onFocus={e=>e.target.style.borderColor=color}
            onBlur={e=>e.target.style.borderColor=errors.explain?'#E53935':'#E0E0E0'}/>
          {errors.explain && <div style={{fontSize:11,color:'#E53935',marginTop:3}}>{errors.explain}</div>}
        </div>

        {/* XP */}
        <div style={{background:'#fff',borderRadius:13,padding:'14px 16px',
          marginBottom:20,border:'1px solid #E8E8E8',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          {label('XP por resolver correctamente')}
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <input type="number" min="5" max="50" step="5" value={xp}
              onChange={e=>setXp(Number(e.target.value))}
              style={{...fieldStyle(false), width:90, textAlign:'center',
                fontSize:18, fontWeight:700, color}}
              onFocus={e=>e.target.style.borderColor=color}
              onBlur={e=>e.target.style.borderColor='#E0E0E0'}/>
            <span style={{fontSize:13,color:'#888'}}>XP por ejercicio correcto ⚡</span>
          </div>
        </div>

        {/* Preview SIGMA hint */}
        {hint && (
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:'#888',marginBottom:6,
              textTransform:'uppercase',letterSpacing:'0.4px'}}>Preview — SIGMA Pista</div>
            <SigmaBubble state="apoyo">{hint}</SigmaBubble>
          </div>
        )}

        {/* Botones */}
        <div style={{display:'flex',gap:10,paddingBottom:8}}>
          <button onClick={handleSave}
            style={{flex:1,padding:'15px',borderRadius:13,
              background: saved
                ? 'linear-gradient(135deg,#2E7D32,#43A047)'
                : `linear-gradient(135deg,${color}CC,${color})`,
              color:'#fff',border:'none',fontSize:15,fontWeight:700,cursor:'pointer',
              boxShadow:`0 6px 20px ${color}44`,transition:'all 0.2s',letterSpacing:'-0.2px'}}>
            {saved ? '✓ Guardado' : isNew ? 'Guardar ejercicio' : 'Actualizar ejercicio'}
          </button>
          <button onClick={()=>setScreen('admin')}
            style={{padding:'15px 18px',borderRadius:13,background:'transparent',
              border:'1.5px solid #E0E0E0',color:'#666',fontSize:14,fontWeight:600,
              cursor:'pointer',whiteSpace:'nowrap'}}>
            Cancelar
          </button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { AdminPanelScreen, ExerciseEditorScreen });

  const TWEAK_DEFAULTS = { "startScreen": "login", "theme": "light", "nickname": "Ana" };
  const ALL_SCREENS = ['login','onboarding','dashboard','levels','exercise','result','teacher',
    'level_fase_a','level_fase_b','result_correct','result_wrong','level_complete','admin','exercise_editor'];

  function App() {
    const saved = () => { try { return JSON.parse(localStorage.getItem('integra_state') || '{}'); } catch{ return {}; } };
    const [screen,    setScreen]    = React.useState(() => saved().screen    || TWEAK_DEFAULTS.startScreen);
    const [themeName, setThemeName] = React.useState(() => saved().theme     || TWEAK_DEFAULTS.theme);
    const [nickname,  setNickname]  = React.useState(() => saved().nickname  || TWEAK_DEFAULTS.nickname);
    const [showTweaks,    setShowTweaks]    = React.useState(false);
    const [screenKey,     setScreenKey]     = React.useState(0);
    const [selectedLevel, setSelectedLevel] = React.useState(0);
    const [exerciseIdx,   setExerciseIdx]   = React.useState(0);
    const [lastWrong,     setLastWrong]     = React.useState(null);
    const [starsEarned,   setStarsEarned]   = React.useState(3);
    const [lives,         setLives]         = React.useState(3);
    const [editingExercise, setEditingExercise] = React.useState(null);

    React.useEffect(()=>{ localStorage.setItem('integra_state', JSON.stringify({ screen, theme: themeName, nickname })); }, [screen, themeName, nickname]);

    const goTo = (s) => { setScreen(s); setScreenKey(k=>k+1); };

    React.useEffect(()=>{
      const handler = (e) => {
        if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
        if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
      };
      window.addEventListener('message', handler);
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      return () => window.removeEventListener('message', handler);
    }, []);

    const handleLogin = () => { const done = localStorage.getItem('integra_onboarding_done'); goTo(done ? 'dashboard' : 'onboarding'); };
    const handleOnboardingComplete = (data) => {
      if (data.nickname) setNickname(data.nickname);
      if (data.theme)    setThemeName(data.theme);
      localStorage.setItem('integra_onboarding_done', '1');
      goTo('dashboard');
    };

    const t = THEMES[themeName] || THEMES.light;
    const screenLabels = {
      login:'01 Login', onboarding:'02 Onboarding', dashboard:'03 Dashboard', levels:'04 Mapa de niveles',
      exercise:'05 Ejercicio', result:'06 Resultado', teacher:'07 Panel docente',
      level_fase_a:'08 Fase A · Aprendizaje', level_fase_b:'09 Fase B · Ejercicio',
      result_correct:'10 Resultado Correcto', result_wrong:'11 Resultado Incorrecto',
      level_complete:'12 Nivel Completado', admin:'13 Panel Admin', exercise_editor:'14 Editor Ejercicio',
    };

    return (
      <React.Fragment>
        <ThemeCtx.Provider value={t}>
        <div style={{width:'100%',maxWidth:430,minHeight:'100vh',background:t.appBg,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden',boxShadow:'0 0 0 1px rgba(0,0,0,0.06), 0 24px 80px rgba(0,0,0,0.22)'}}>
          <div key={screenKey} data-screen-label={screenLabels[screen]||screen} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',animation:'screenIn 0.25s ease both'}}>
            {screen==='login'           && <LoginScreen       setScreen={goTo} onLogin={handleLogin}/>}
            {screen==='onboarding'      && <OnboardingWizard  onComplete={handleOnboardingComplete}/>}
            {screen==='dashboard'       && <DashboardScreen   nickname={nickname} setScreen={goTo} themeName={themeName} setSelectedLevel={setSelectedLevel}/>}
            {screen==='levels'          && <LevelMapScreen    setScreen={goTo} setSelectedLevel={setSelectedLevel}/>}
            {screen==='exercise'        && <ExerciseScreen    setScreen={goTo}/>}
            {screen==='result'          && <ResultScreen      setScreen={goTo}/>}
            {screen==='teacher'         && <TeacherScreen     setScreen={goTo}/>}
            {screen==='profile'         && <DashboardScreen   nickname={nickname} setScreen={goTo} themeName={themeName}/>}
            {screen==='level_fase_a'    && <LevelFaseAScreen  levelId={selectedLevel} setScreen={goTo} setExerciseIdx={setExerciseIdx}/>}
            {screen==='level_fase_b'    && <LevelFaseBScreen  levelId={selectedLevel} exerciseIdx={exerciseIdx} setExerciseIdx={setExerciseIdx} setScreen={goTo} setLastWrong={setLastWrong} lives={lives} setLives={setLives}/>}
            {screen==='result_correct'  && <ResultCorrectScreen levelId={selectedLevel} exerciseIdx={exerciseIdx} setExerciseIdx={(i)=>{ setExerciseIdx(i); setLives(3); }} setScreen={goTo}/>}
            {screen==='result_wrong'    && <ResultWrongScreen  levelId={selectedLevel} exerciseIdx={exerciseIdx} lastWrong={lastWrong} setScreen={goTo} lives={lives}/>}
            {screen==='level_complete'  && <LevelCompleteScreen levelId={selectedLevel} starsEarned={lives>=3?3:lives>=1?2:1} xpEarned={null} setScreen={goTo}/>}
            {screen==='admin'           && <AdminPanelScreen   setScreen={goTo} setEditingExercise={setEditingExercise}/>}
            {screen==='exercise_editor' && <ExerciseEditorScreen setScreen={goTo} editingExercise={editingExercise}/>}
          </div>
        </div>
        </ThemeCtx.Provider>

        <div className={`tweaks-panel ${showTweaks?'open':''}`}>
          <div className="tweaks-title">Tweaks</div>
          <div className="tweaks-section">Pantalla</div>
          {ALL_SCREENS.map(s=>(<button key={s} className={`tweaks-btn ${screen===s?'active':''}`} onClick={()=>goTo(s)}>{screenLabels[s]||s}</button>))}
          <div className="tweaks-section">Nivel activo</div>
          <div className="tweaks-chips">{[0,1,2].map(lv=>(<button key={lv} className={`tweaks-chip ${selectedLevel===lv?'active':''}`} onClick={()=>setSelectedLevel(lv)}>Nv.{lv}</button>))}</div>
          <div className="tweaks-section">Vidas</div>
          <div className="tweaks-chips">{[0,1,2,3].map(n=>(<button key={n} className={`tweaks-chip ${lives===n?'active':''}`} onClick={()=>setLives(n)}>{'❤️'.repeat(n)||'0'}</button>))}</div>
          <div className="tweaks-section">Tema</div>
          <div className="tweaks-chips">{['light','dark','custom'].map(th=>(<button key={th} className={`tweaks-chip ${themeName===th?'active':''}`} onClick={()=>setThemeName(th)}>{th==='light'?'☀️ Claro':th==='dark'?'🌙 Oscuro':'🎨 Custom'}</button>))}</div>
          <div className="tweaks-section">Nickname</div>
          <input value={nickname} onChange={e=>{setNickname(e.target.value); window.parent.postMessage({type:'__edit_mode_set_keys',edits:{nickname:e.target.value}},'*');}}
            style={{width:'100%',padding:'7px 10px',borderRadius:8,border:'1.5px solid #E4E4E4',fontSize:13,outline:'none',fontFamily:'inherit'}}
            onFocus={e=>e.target.style.borderColor='#2E7D32'} onBlur={e=>e.target.style.borderColor='#E4E4E4'}/>
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid #F0F0F0'}}>
            <div className="tweaks-section" style={{marginTop:0}}>SIGMA Demo</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {Object.keys(SIGMA_STATES).map(state=>(
                <div key={state} title={state} style={{cursor:'pointer',borderRadius:10,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.12)',transition:'transform 0.15s'}}
                  onMouseOver={e=>e.currentTarget.style.transform='scale(1.12)'} onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}>
                  <SigmaLogo state={state} size={34}/>
                </div>
              ))}
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
